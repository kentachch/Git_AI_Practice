<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>問題2：成人？ 未成年？</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <span class="tag">if・else ｜ じぶんで（必須）</span>
    <h1>問題2：成人？ 未成年？</h1>
    <p>年齢を入れて［実行］を押すと、<b>18歳以上</b>なら「成人です」、それ以外は「未成年です」と表示します。</p>
    <div class="row">
      <label for="num">年齢：</label>
      <input id="num" type="number" placeholder="例：20">
      <button id="run">実行</button>
    </div>
    <p>結果：</p>
    <ol id="result"></ol>
  </div>
  <script src="script.js"></script>
</body>
</html>
