<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>問題1：合格？ 不合格？</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <span class="tag">if・else ｜ 先生といっしょに</span>
    <h1>問題1：合格？ 不合格？</h1>
    <p>点数を入れて［実行］を押すと、<b>60点以上</b>なら「合格」、それ以外は「不合格」と表示します。</p>
    <div class="row">
      <label for="num">点数：</label>
      <input id="num" type="number" placeholder="例：80">
      <button id="run">実行</button>
    </div>
    <p>結果：</p>
    <ol id="result"></ol>
  </div>
  <script src="script.js"></script>
</body>
</html>
